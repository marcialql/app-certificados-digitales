# Sitio Nginx para certificados.marcialql.es
# Decisión: Nginx hace de proxy inverso de TODO hacia el proceso Node
# (127.0.0.1:3000), que ya sirve dist/ y /api/ (server/index.ts).
# Copiar a /etc/nginx/sites-available/ionos-app y enlazar en sites-enabled.
# Certbot (`certbot --nginx -d certificados.marcialql.es`) añade/ajusta las
# rutas de ssl_certificate; hasta entonces el bloque 443 no arrancará.

server {
    listen 80;
    listen [::]:80;
    server_name certificados.marcialql.es;

    # Validación ACME y redirección a HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name certificados.marcialql.es;

    ssl_certificate     /etc/letsencrypt/live/certificados.marcialql.es/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/certificados.marcialql.es/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
